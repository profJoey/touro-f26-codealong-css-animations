<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations Code-Along</title>
  <!-- To show the finished result, change this to completed-style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>CSS Animations</h1>

  <h2>Part 1: Transitions (hover me)</h2>
  <div class="row">
    <div class="box step1">1</div>
    <div class="box step2">2</div>
    <div class="box step3a">ease</div>
    <div class="box step3b">linear</div>
    <div class="box step3c">ease-in-out</div>
    <div class="box step4">4</div>
  </div>

  <h2>Part 2: Transforms (hover me)</h2>
  <div class="row">
    <div class="box step5a">translate</div>
    <div class="box step5b">rotate</div>
    <div class="box step5c">scale</div>
    <div class="box step6">lift</div>
  </div>

  <h2>Part 3: Keyframes (no hover needed)</h2>
  <div class="row">
    <div class="box step7">fade in</div>
    <div class="box step8">bounce</div>
    <div class="box step9">pulse</div>
    <div class="box step10">wiggle</div>
  </div>
</body>
</html>
